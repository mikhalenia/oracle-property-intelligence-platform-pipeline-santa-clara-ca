name: ingest
on:
  schedule: [{ cron: "30 0 * * *" }] # 00:30 UTC = 17:30 PT, after San José's 16:00 refresh
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even when every source is unchanged (run --force)"
        type: boolean
        default: false
      bootstrap:
        description: "Skip the state preflight (first run: the sync marker and DuckDB file do not exist yet)"
        type: boolean
        default: false
concurrency: ingest
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # data/ holds the DuckDB file and the D1 sync marker (d1-sync-state.json); raw downloads are not cached.
      # Without the marker, sync refuses to run (it never wipes a D1 that already holds a snapshot).
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            !data/raw
          key: pipeline-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pipeline-data-
      - name: Preflight pipeline state
        if: ${{ !inputs.bootstrap }}
        run: |
          for f in data/d1-sync-state.json data/santa-clara.duckdb; do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f: seed the Actions cache: run the pipeline once locally and upload data/ via actions/cache, or use workflow_dispatch input bootstrap=true"
              exit 1
            fi
          done
      # Plain `run`: a day whose sources are all unchanged is not republished (`run --force` would).
      - run: pnpm nx run pipeline:cli -- run ${{ inputs.force && '--force' || '' }}
        env:
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
          FILEBASE_BUCKET: ${{ secrets.FILEBASE_BUCKET }}
          # Read by wrangler during the `sync` step of `run`.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Saved even when a step failed: a published run must not be forgotten by the next job.
      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            !data/raw
          key: pipeline-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit run records
        if: always()
        run: |
          git config user.name "scc-pipeline-bot"
          git config user.email "pipeline@users.noreply.github.com"
          git add docs/runs
          git commit -m "chore(runs): record pipeline run" || echo "nothing to commit"
          git push
